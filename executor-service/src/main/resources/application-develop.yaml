hft:
  mode: PAPER
  events:
    enabled: true
  polymarket:
    market-ws-enabled: true
    auth:
      private-key: ""
      auto-create-or-derive-api-creds: false

logging:
  level:
    com.polybot.hft: INFO
    com.polybot.hft.executor.settlement: DEBUG

executor:
  sim:
    enabled: true
    fills-enabled: ${EXECUTOR_SIM_FILLS_ENABLED:false}

  onchain:
    rpc-url: ${POLYGON_RPC_URL:https://polygon-rpc.com}
    proxy-wallet-factory-address: ""

  settlement:
    enabled: false
    dry-run: true
    poll-interval-millis: 30000
    min-merge-shares: 10
    max-retries: 3
    merge-only-near-end: true
    merge-seconds-before-end: 600

  account:
    initial-cash: ${PAPER_INITIAL_CASH:500}
    max-order: ${PAPER_MAX_ORDER:25}
    max-token-exposure: ${PAPER_MAX_TOKEN_EXPOSURE:25}
    max-gross-exposure: ${PAPER_MAX_GROSS_EXPOSURE:250}
    daily-loss: ${PAPER_DAILY_LOSS:25}
    drawdown: ${PAPER_MAX_DRAWDOWN:50}
    state-path: ${PAPER_STATE_PATH:state/paper-account.json}
