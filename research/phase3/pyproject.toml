[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "khaledpoly-research"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
polybot-research = "polybot_sdk.cli:main"
[tool.setuptools]
packages = ["polybot_sdk"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
