name: PAPER causal entry decision witnesses
on:
  push:
    branches: [paper-fill-investigation]
    paths:
      - '.github/workflows/entry-decision-witness.yml'
      - 'research/phase6/entry-decision-witness-freeze.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-entry-decision-witness
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: All regressions and observer-on/off behavioral equivalence
        run: |
          mvn --batch-mode --no-transfer-progress verify
          for phase in 2 3 4 5 6; do python3 -m unittest discover -s research/phase${phase}/tests -q; done
      - uses: actions/upload-artifact@v4
        with:
          name: entry-witness-executor
          retention-days: 3
          path: executor-service/target/executor-service-0.6.0.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-witness-tests
          retention-days: 7
          path: '**/target/surefire-reports/'
  witness:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: entry-witness-executor
          path: executor-service/target
      - uses: actions/download-artifact@v4
        with:
          name: fresh-paper-compressed-tape
          run-id: 39067539123
          github-token: ${{ github.token }}
          path: witness-input
      - name: One observational replay, preserve complete causal warmup and verify original account
        run: >-
          python3 -u -m research.phase6.entry_decision_witness --input-root witness-input
          --output research/output/entry-witness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: causal-entry-decision-witnesses
          retention-days: 7
          path: |
            research/output/entry-witness/report.json
            research/output/entry-witness/audit.jsonl
            research/output/entry-witness/witness-verification.json
