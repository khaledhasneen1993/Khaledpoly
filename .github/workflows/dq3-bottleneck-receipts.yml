name: PAPER DQ3 first bottleneck leg eight receipts
on:
  push:
    branches: [paper-fill-investigation]
    paths:
      - '.github/workflows/dq3-bottleneck-receipts.yml'
      - 'research/phase6/dq3-bottleneck-receipts-freeze.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-dq3-eight-bottleneck-receipts
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit-only Keccak decoder
        run: |
          python3 -m venv "$RUNNER_TEMP/dq3-receipt-env"
          "$RUNNER_TEMP/dq3-receipt-env/bin/pip" install --only-binary=:all: --no-deps pycryptodome==3.23.0
      - name: Offline source and phase6 regressions before public reads
        run: '"$RUNNER_TEMP/dq3-receipt-env/bin/python" -m unittest discover -s research/phase6/tests -q'
      - name: Eight frozen public receipt reads, preserve exact RAW and block evidence
        run: >-
          "$RUNNER_TEMP/dq3-receipt-env/bin/python" -u -m research.phase6.dq3_bottleneck_receipts
          --output research/output/dq3-bottleneck-receipts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dq3-first-bottleneck-leg-receipts
          retention-days: 7
          path: research/output/dq3-bottleneck-receipts/
