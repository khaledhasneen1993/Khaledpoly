name: Polybot verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - run: python3 -m unittest discover -s research/phase2/tests -v
      - run: python3 -m unittest discover -s research/phase3/tests -v
      - run: python3 -m unittest discover -s research/phase4/tests -v
      - run: python3 -m research.phase4.audit --help
      - run: python3 -m research.phase4.recorder --help
      - name: Phase 4 sampled Polymarket event and book evidence (never qualification)
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase4-data-reliability'
        timeout-minutes: 3
        run: |
          mkdir -p research/output
          python3 -m research.phase4.market_evidence --category politics --limit 1 --max-books 2 --output research/output/politics-evidence.json
          python3 -m research.phase4.market_evidence --category sports --limit 1 --max-books 2 --output research/output/sports-evidence.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase4-data-reliability' && always()
        with:
          name: phase4-polymarket-market-evidence
          path: |
            research/output/politics-evidence.json
            research/output/sports-evidence.json
      - name: Phase 4 public source reachability (never qualification)
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase4-data-reliability'
        timeout-minutes: 2
        run: |
          mkdir -p research/output
          python3 -m research.phase4.probe --output research/output/phase4-public-sources.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase4-data-reliability' && always()
        with:
          name: phase4-public-sources
          path: research/output/phase4-public-sources.json
      - run: python3 -m research.phase3 inspect executor-service/target/phase3-snapshot.json --replay-clock
      - name: Verify installed Python research SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/phase3-sdk"
          "$RUNNER_TEMP/phase3-sdk/bin/pip" install --disable-pip-version-check --no-deps ./research/phase3
          "$RUNNER_TEMP/phase3-sdk/bin/polybot-research" inspect executor-service/target/phase3-snapshot.json --replay-clock
      - name: Phase 3 public PAPER and CEX integration smoke
        if: github.event_name == 'push' && (github.ref == 'refs/heads/phase3-research-foundation' || github.ref == 'refs/heads/phase4-data-reliability')
        timeout-minutes: 4
        run: python3 research/phase3/public_smoke.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/phase3-research-foundation' || github.ref == 'refs/heads/phase4-data-reliability') && always()
        with:
          name: phase3-public-research
          path: research/output/phase3-public/
      - name: Phase 3 actual virtual-order execution and label smoke
        if: github.event_name == 'push' && (github.ref == 'refs/heads/phase3-research-foundation' || github.ref == 'refs/heads/phase4-data-reliability')
        timeout-minutes: 5
        run: python3 research/phase3/public_smoke.py --execute-paper
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/phase3-research-foundation' || github.ref == 'refs/heads/phase4-data-reliability') && always()
        with:
          name: phase3-public-execution
          path: research/output/phase3-public-execution/
      - name: Record public data smoke (PAPER, no account)
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase2-paper-validation'
        timeout-minutes: 25
        run: |
          status=0
          timeout --signal=TERM --kill-after=20 180 java -jar executor-service/target/executor-service-0.0.1-SNAPSHOT.jar --server.port=18080 --spring.application.name=paper-ingestor --hft.mode=PAPER --hft.events.enabled=false --executor.sim.enabled=false --hft.strategy.gabagool.enabled=false --hft.polymarket.market-ws-enabled=true --paper.market-data.enabled=true --paper.record.directory=research/output/public-smoke --paper.record.revision=${{ github.sha }} > research-public-smoke.log 2>&1 || status=$?
          test "$status" = 0 -o "$status" = 124
          python3 research/phase2/inspect_recording.py research/output/public-smoke
          python3 research/phase2/replay_smoke.py research/output/public-smoke
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase2-paper-validation' && always()
        with:
          name: phase2-public-recording
          path: |
            research/output/public-smoke/
            research-public-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
