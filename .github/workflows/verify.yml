name: Khaledpoly PAPER verification

on:
  push:
    branches:
      - main
      - phase6-paper-integration
      - paper-quality-upgrade
  workflow_dispatch:

permissions:
  contents: read

# Only one run per branch; no duplicate push/pull_request builds.
concurrency:
  group: khaledpoly-paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: One Java 0.6.0 verification build
        run: mvn --batch-mode --no-transfer-progress verify
      - name: All current PAPER Python regression suites
        run: |
          python3 -m unittest discover -s research/phase2/tests -v
          python3 -m unittest discover -s research/phase3/tests -v
          python3 -m unittest discover -s research/phase4/tests -v
          python3 -m unittest discover -s research/phase5/tests -v
          python3 -m unittest discover -s research/phase6/tests -v
      - name: Verify one installable 0.6.0 Python SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/khaledpoly-sdk"
          "$RUNNER_TEMP/khaledpoly-sdk/bin/pip" install --disable-pip-version-check --no-deps .
          "$RUNNER_TEMP/khaledpoly-sdk/bin/khaledpoly-paper-sdk" --help
          "$RUNNER_TEMP/khaledpoly-sdk/bin/python" -c "from research.phase3.polybot_sdk.accounts import AccountRegistry; from research.phase5.paper_strategy_adapter import event_proposal; from research.phase6.virtual_paper_bridge import DurableVirtualPaperOrders; print('KHALEDPOLY_PAPER_0_6_0_IMPORT_OK')"
      - name: PAPER snapshot and research CLIs
        run: |
          python3 -m research.phase3 inspect executor-service/target/phase3-snapshot.json --replay-clock
          python3 -m research.phase4.final_gate --help
          python3 -m research.phase4.recorder --help
          python3 -m research.phase5.offline_benchmark --help
          python3 -m research.phase5.cex_signals --help
          python3 -m research.phase5.cex_forward --help
          python3 -m research.phase5.walk_forward --help
          python3 -m research.phase6.paper_screen_bridge --help
          python3 -m research.phase6.virtual_paper_bridge --help
          python3 -m research.phase5.portfolio_admission --help
          python3 -m research.phase6.minimal_runtime --help
          bash -n scripts/run-paper-minimal.sh
      - name: Public Polymarket and CEX read-only smoke (NOT qualification)
        timeout-minutes: 4
        run: python3 research/phase3/public_smoke.py
      - name: Isolated public CEX signal and forward-print checks
        timeout-minutes: 2
        run: |
          python3 -m research.phase5.cex_signals \
            research/output/phase3-public/signals/public.jsonl \
            --lookback 5 --max-age-ms 2000 \
            --output research/output/phase5-cex-signals.json
          python3 -m research.phase5.cex_forward \
            research/output/phase3-public/signals/public.jsonl \
            --horizon-ms 1000 --max-label-delay-ms 2000 --min-labeled 100 \
            --output research/output/phase5-cex-forward.json
      - name: Opt-in disposable virtual PAPER execution and replay
        timeout-minutes: 5
        run: python3 research/phase3/public_smoke.py --execute-paper
      - name: Cross-check all four actual public and PAPER reports
        run: |
          python3 -m research.phase6.public_smoke_gate \
            --root . --output research/output/phase6-public-smoke-audit.json
      - name: Final software-only SHA inventory and NO_GO release gate
        run: |
          python3 -m research.phase6.software_gate \
            --root . --output research/output/phase6-software-check.json
      - name: Retain one short-lived verification evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaledpoly-paper-0.6.0-evidence
          retention-days: 3
          if-no-files-found: ignore
          path: |
            research/output/phase6-public-smoke-audit.json
            research/output/phase6-software-check.json
            research/output/phase3-public/summary.json
            research/output/phase3-public-execution/execution-verification.json
            research/output/phase5-cex-signals.json
            research/output/phase5-cex-forward.json
            **/target/surefire-reports/
