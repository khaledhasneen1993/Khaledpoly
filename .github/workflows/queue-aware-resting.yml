name: PAPER QW0 conditional resting lifetime
on:
  push:
    branches: [paper-fill-investigation]
    paths: ['.github/workflows/queue-aware-resting.yml', 'research/phase6/queue-aware-resting-freeze.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-qw0-conditional-resting
  cancel-in-progress: false
jobs:
  resting:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Offline regressions
        run: python3 -m unittest discover -s research/phase6/tests -q
      - uses: actions/download-artifact@v4
        with:
          name: entry-witness-executor
          run-id: 39168798844
          github-token: ${{ github.token }}
          path: probe-engine
      - name: Reuse retained bounded context, no tape download or capture
        run: python3 -m research.phase6.queue_aware_resting --output research/output/qw0-resting
      - name: Compile observers only against unchanged verified engine
        run: |
          mkdir -p "$RUNNER_TEMP/qw0-resting"
          unzip -q probe-engine/executor-service-0.6.0.jar 'BOOT-INF/lib/*' -d "$RUNNER_TEMP/qw0-engine"
          javac -cp "$RUNNER_TEMP/qw0-engine/BOOT-INF/lib/*" -d "$RUNNER_TEMP/qw0-resting" research/phase6/Qw0CausalProbe.java research/phase6/Qw0RestingProbe.java
          java -cp "$RUNNER_TEMP/qw0-resting:$RUNNER_TEMP/qw0-engine/BOOT-INF/lib/*" com.polybot.hft.paper.Qw0CausalProbe --self-test
          java -Xmx2g -cp "$RUNNER_TEMP/qw0-resting:$RUNNER_TEMP/qw0-engine/BOOT-INF/lib/*" com.polybot.hft.paper.Qw0RestingProbe research/output/qw0-resting/context.json.gz research/output/qw0-resting/bindings.json research/output/qw0-resting/evidence.json research/output/qw0-resting/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qw0-conditional-resting
          retention-days: 7
          path: research/output/qw0-resting/
