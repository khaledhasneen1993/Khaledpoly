name: PAPER exact655 next two receipts ONLY
on:
  push:
    branches: [paper-fill-investigation]
    paths: ['.github/workflows/post655-next-receipts.yml', 'research/phase6/post655-next-receipts-freeze.json']
permissions:
  contents: read
concurrency:
  group: paper-exact655-next-two-receipts
  cancel-in-progress: false
jobs:
  next-two-public-readonly-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Frozen two-target provenance and offline regressions before reads
        run: |
          python3 -c 'import json,hashlib;from pathlib import Path;f=json.loads(Path("research/phase6/post655-next-receipts-freeze.json").read_bytes());assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==s for p,s in f["filesSha256"].items())'
          python3 -m unittest research.phase6.tests.test_post655_next_receipts research.phase6.tests.test_post653_pool_replay_result research.phase6.tests.test_receipt_audit research.phase6.tests.test_route_coverage_audit -q
          python3 -m research.phase6.post655_next_receipts
      - name: At most two public receipts and two matching blocks
        run: python3 -u -m research.phase6.post655_next_receipts --output research/output/post655-next-receipts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact655-next-two-receipts
          retention-days: 7
          path: research/output/post655-next-receipts/
          if-no-files-found: error
