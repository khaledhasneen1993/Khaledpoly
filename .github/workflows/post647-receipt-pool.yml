name: PAPER exact649 receipt pool native parity ONLY
on:
  push:
    branches: [paper-fill-investigation]
    paths: ['.github/workflows/post647-receipt-pool.yml', 'research/phase6/post647-pool-freeze.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-exact649-native-parity
  cancel-in-progress: false
jobs:
  native-parity-no-tape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Frozen649 expansion and regressions; no RPC or tape
        run: |
          python3 -c 'import json,hashlib;from pathlib import Path;f=json.loads(Path("research/phase6/post647-pool-freeze.json").read_bytes());assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==s for p,s in f["filesSha256"].items())'
          python3 -m unittest research.phase6.tests.test_post647_receipt_pool research.phase6.tests.test_post647_next_receipts_result -q
          python3 -m research.phase6.post647_receipt_pool --output "$RUNNER_TEMP/pool649"
          python3 -m research.phase6.next_postactivation_pool_build --output "$RUNNER_TEMP/source649"
      - uses: actions/download-artifact@v4
        with:
          name: entry-witness-executor
          run-id: 39168798844
          github-token: ${{ github.token }}
          path: probe-engine
      - name: Verify all649 native identities and1540 tuples
        run: |
          python3 -c 'import hashlib;from pathlib import Path;assert hashlib.sha256(Path("probe-engine/executor-service-0.6.0.jar").read_bytes()).hexdigest()=="bfc7bef081927f774374f92e5443c197e308e4828983dd9c19ac0ef280c45963"'
          unzip -q probe-engine/executor-service-0.6.0.jar 'BOOT-INF/lib/*' -d "$RUNNER_TEMP/deps649"
          mkdir -p "$RUNNER_TEMP/classes649" research/output/post647-pool649
          javac -cp "$RUNNER_TEMP/deps649/BOOT-INF/lib/*" -d "$RUNNER_TEMP/classes649" $(find "$RUNNER_TEMP/source649/polybot-core/src/main/java" -name '*.java') research/phase6/ConservedMixedReplayLabels.java research/phase6/ConservedMixedReplayLabelsProbe.java research/phase6/OfflineSessionLabels.java research/phase6/CanonicalSessionParityProbe.java research/phase6/FrozenResearchPolicies.java research/phase6/FrozenStrategySessionProbe.java research/phase6/ConservedReceiptPool.java research/phase6/ConservedReceiptPoolProbe.java research/phase6/NativeReplaySupport.java research/phase6/CompleteSourceIdentityIndex.java "$RUNNER_TEMP/source649/research/phase6/IndexedExecutionLabels.java" research/phase6/IndexedReplaySupport.java research/phase6/Post647ReceiptPoolProbe.java
          cp649="$RUNNER_TEMP/classes649:$RUNNER_TEMP/deps649/BOOT-INF/lib/*"
          java -Xmx1g -cp "$cp649" com.polybot.hft.paper.Post647ReceiptPoolProbe "$RUNNER_TEMP/pool649/pool.json" "$RUNNER_TEMP/pool649/source-identities.json" "$RUNNER_TEMP/native649"
          cp "$RUNNER_TEMP/native649/native-proof.json" "$RUNNER_TEMP/pool649/summary.json" research/output/post647-pool649/
          python3 -c 'import json;from pathlib import Path;from research.phase6.post647_receipt_pool import verify_native;r=Path("research/output/post647-pool649");print(verify_native(json.loads((r/"native-proof.json").read_text()),json.loads((r/"summary.json").read_text())))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact649-native-parity-no-tape
          retention-days: 7
          path: research/output/post647-pool649/
          if-no-files-found: error
