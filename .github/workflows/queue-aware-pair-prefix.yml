name: PAPER QW0 both-order original prefix
on:
  push:
    branches: [paper-fill-investigation]
    paths: ['.github/workflows/queue-aware-pair-prefix.yml', 'research/phase6/queue-aware-pair-prefix-freeze.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-qw0-both-order-prefix
  cancel-in-progress: false
jobs:
  prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: All offline regressions before new gate evaluation
        run: python3 -m unittest discover -s research/phase6/tests -q
      - uses: actions/download-artifact@v4
        with:
          name: entry-witness-executor
          run-id: 39168798844
          github-token: ${{ github.token }}
          path: probe-engine
      - name: Reuse retained original context and both actual receipt cohorts
        run: python3 -m research.phase6.queue_aware_pair_prefix --output research/output/qw0-pair-prefix
      - name: Compile observers only and run unchanged actual engine
        run: |
          mkdir -p "$RUNNER_TEMP/qw0-prefix"
          unzip -q probe-engine/executor-service-0.6.0.jar 'BOOT-INF/lib/*' -d "$RUNNER_TEMP/qw0-engine"
          javac -cp "$RUNNER_TEMP/qw0-engine/BOOT-INF/lib/*" -d "$RUNNER_TEMP/qw0-prefix" research/phase6/Qw0CausalProbe.java research/phase6/Qw0RestingProbe.java research/phase6/Qw0PairPrefixProbe.java
          java -cp "$RUNNER_TEMP/qw0-prefix:$RUNNER_TEMP/qw0-engine/BOOT-INF/lib/*" com.polybot.hft.paper.Qw0CausalProbe --self-test
          java -Xmx2g -cp "$RUNNER_TEMP/qw0-prefix:$RUNNER_TEMP/qw0-engine/BOOT-INF/lib/*" com.polybot.hft.paper.Qw0PairPrefixProbe research/output/qw0-pair-prefix/context.json.gz research/output/qw0-pair-prefix/bindings.json research/output/qw0-pair-prefix/evidence.json research/output/qw0-pair-prefix/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qw0-both-order-prefix
          retention-days: 7
          path: research/output/qw0-pair-prefix/
