name: PAPER atomic empty exposure guard proof only
on:
  push:
    branches: [paper-fill-investigation]
    paths: ['.github/workflows/atomic-no-order-guard.yml', 'research/phase6/atomic-guard-freeze.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-atomic-empty-exposure-guard-proof
  cancel-in-progress: false
jobs:
  guard-proof-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Bounded offline regressions; no market capture, RPC, or source replay
        run: |
          python3 -m unittest research.phase6.tests.test_atomic_guard research.phase6.tests.test_native_source_index research.phase6.tests.test_complete_source_index research.phase6.tests.test_no_order_result research.phase6.tests.test_expanded_receipt_pool research.phase6.tests.test_expanded_pool_result research.phase6.tests.test_full_runner_build research.phase6.tests.test_full_runner_diagnosis -q
          python3 -m research.phase6.atomic_guard_build --output "$RUNNER_TEMP/guard-src"
          python3 -m research.phase6.expanded_receipt_pool --output "$RUNNER_TEMP/guard-inputs"
      - uses: actions/download-artifact@v4
        with:
          name: entry-witness-executor
          run-id: 39168798844
          github-token: ${{ github.token }}
          path: proof-engine
      - name: Compile isolated guard, prove locks, retain no-order counterexamples and default parity
        run: |
          python3 -c 'import hashlib;from pathlib import Path;assert hashlib.sha256(Path("proof-engine/executor-service-0.6.0.jar").read_bytes()).hexdigest()=="bfc7bef081927f774374f92e5443c197e308e4828983dd9c19ac0ef280c45963"'
          unzip -q proof-engine/executor-service-0.6.0.jar 'BOOT-INF/lib/*' -d "$RUNNER_TEMP/guard-deps"
          mkdir -p "$RUNNER_TEMP/guard-classes" research/output/atomic-guard
          javac -cp "$RUNNER_TEMP/guard-deps/BOOT-INF/lib/*" -d "$RUNNER_TEMP/guard-classes" $(find "$RUNNER_TEMP/guard-src/polybot-core/src/main/java" -name '*.java') research/phase6/ConservedMixedReplayLabels.java research/phase6/ConservedMixedReplayLabelsProbe.java research/phase6/OfflineSessionLabels.java research/phase6/CanonicalSessionParityProbe.java research/phase6/FrozenResearchPolicies.java research/phase6/FrozenStrategySessionProbe.java research/phase6/ConservedReceiptPool.java research/phase6/ConservedReceiptPoolProbe.java research/phase6/NativeReplaySupport.java research/phase6/NoOrderDifferentialProbe.java research/phase6/AtomicNoOrderGuardProbe.java
          guard_cp="$RUNNER_TEMP/guard-classes:$RUNNER_TEMP/guard-deps/BOOT-INF/lib/*"
          java -Xmx1g -cp "$guard_cp" com.polybot.hft.paper.AtomicNoOrderGuardProbe "$RUNNER_TEMP/atomic-proof"
          cp "$RUNNER_TEMP/atomic-proof/atomic-guard-proof.json" research/output/atomic-guard/
          python3 -m research.phase6.atomic_guard_result --proof research/output/atomic-guard/atomic-guard-proof.json > research/output/atomic-guard/verification.json
          java -Xmx1g -cp "$guard_cp" com.polybot.hft.paper.CanonicalSessionParityProbe "$RUNNER_TEMP/guard-default"
          cp "$RUNNER_TEMP/guard-default/parity.json" research/output/atomic-guard/default-parity.json
          python3 -c 'import json;from pathlib import Path;assert json.loads(Path("research/output/atomic-guard/default-parity.json").read_text())==json.loads(Path("research/experiments/session-bridge-20261019/default-before.json").read_text())'
          java -Xmx1g -cp "$guard_cp" com.polybot.hft.paper.NoOrderDifferentialProbe "$RUNNER_TEMP/guard-inputs/pool.json" "$RUNNER_TEMP/guard-inputs/source-identities.json" "$RUNNER_TEMP/guard-differential"
          cp "$RUNNER_TEMP/guard-differential/no-order-proof.json" research/output/atomic-guard/
          python3 -m research.phase6.no_order_result --root research/output/atomic-guard > research/output/atomic-guard/differential-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-empty-exposure-guard-proof-only
          retention-days: 7
          path: research/output/atomic-guard/
          if-no-files-found: error
