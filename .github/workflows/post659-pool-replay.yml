name: PAPER exact661 ONE same-source baseline QW0 replay
on:
  push:
    branches: [paper-fill-investigation]
    paths: ['.github/workflows/post659-pool-replay.yml', 'research/phase6/post659-replay-freeze.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-exact661-one-original-replay
  cancel-in-progress: false
jobs:
  frozen-one-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Require retained native661 proof and materialize frozen inputs
        run: |
          python3 -c 'import json,hashlib;from pathlib import Path;f=json.loads(Path("research/phase6/post659-replay-freeze.json").read_bytes());assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==s for p,s in f["filesSha256"].items())'
          python3 -c 'from research.phase6.post659_pool_replay import require_native;print(require_native())'
          python3 -m unittest research.phase6.tests.test_post659_pool_replay research.phase6.tests.test_post659_receipt_pool -q
          python3 -m research.phase6.post659_pool_inputs --output "$RUNNER_TEMP/inputs661"
      - name: Checkout frozen exact651 source-builder inputs only
        uses: actions/checkout@v4
        with:
          ref: 2f47b7110908bd9311d410be75dd0173b14f04d7
          path: frozen-source651
          persist-credentials: false
      - name: Generate unchanged exact653, exact655, exact657, exact659 bridges then bind exact661
        run: |
          (cd frozen-source651 && python3 -m research.phase6.post649_pool_build --output "$RUNNER_TEMP/source651")
          python3 -m research.phase6.post651_pool_build --source "$RUNNER_TEMP/source651" --output "$RUNNER_TEMP/source653"
          python3 -m research.phase6.post653_pool_build --source "$RUNNER_TEMP/source653" --output "$RUNNER_TEMP/source655"
          python3 -m research.phase6.post655_pool_build --source "$RUNNER_TEMP/source655" --output "$RUNNER_TEMP/source657"
          python3 -m research.phase6.post657_pool_build --source "$RUNNER_TEMP/source657" --output "$RUNNER_TEMP/source659"
          python3 -m research.phase6.post659_pool_build --source "$RUNNER_TEMP/source659" --output "$RUNNER_TEMP/source661"
      - name: Checkout frozen executor source after retained artifact expiry
        uses: actions/checkout@v4
        with:
          ref: 6dc5f25aec764ae55ecf0610a617baba77b7a6f7
          path: frozen-executor
          persist-credentials: false
      - name: Rebuild the frozen executor dependency container only
        working-directory: frozen-executor
        run: mvn --batch-mode --no-transfer-progress -DskipTests -pl executor-service -am package
      - name: Stage and compile exact661 generated-only replay path
        run: |
          mkdir -p replay-engine
          cp frozen-executor/executor-service/target/executor-service-0.6.0.jar replay-engine/
          python3 -c 'import hashlib;from pathlib import Path;assert hashlib.sha256(Path("replay-engine/executor-service-0.6.0.jar").read_bytes()).hexdigest()=="bfc7bef081927f774374f92e5443c197e308e4828983dd9c19ac0ef280c45963"'
          unzip -q replay-engine/executor-service-0.6.0.jar 'BOOT-INF/lib/*' -d "$RUNNER_TEMP/deps661"
          mkdir -p "$RUNNER_TEMP/classes661" research/output/post659-replay661
          javac -cp "$RUNNER_TEMP/deps661/BOOT-INF/lib/*" -d "$RUNNER_TEMP/classes661" $(find "$RUNNER_TEMP/source661/polybot-core/src/main/java" -name '*.java') research/phase6/ConservedMixedReplayLabels.java research/phase6/OfflineSessionLabels.java research/phase6/FrozenResearchPolicies.java research/phase6/ConservedReceiptPool.java research/phase6/NativeReplaySupport.java research/phase6/CompleteSourceIdentityIndex.java "$RUNNER_TEMP/source661/research/phase6/IndexedExecutionLabels.java" research/phase6/IndexedReplaySupport.java
      - name: Download unchanged ORIGINAL DEVELOPMENT source only after proof gates pass
        uses: actions/download-artifact@v4
        with:
          name: fresh-paper-compressed-tape
          run-id: 39067539123
          github-token: ${{ github.token }}
          path: original-development-source
      - name: Run exactly one baseline then unchanged QW0 comparison
        run: >-
          python3 -u -m research.phase6.post659_pool_replay
          --input-root original-development-source
          --inputs "$RUNNER_TEMP/inputs661"
          --classpath "$RUNNER_TEMP/classes661:$RUNNER_TEMP/deps661/BOOT-INF/lib/*"
          --output research/output/post659-replay661/development
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact661-one-same-source-replay-reports
          retention-days: 7
          path: research/output/post659-replay661/
          if-no-files-found: error
