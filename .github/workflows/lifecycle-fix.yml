name: PAPER lifecycle regression and recorded replay
on:
  push:
    branches: [paper-order-lifecycle-fix]
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-lifecycle-fix
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify all Java regression and HTTP replay tests
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Verify all Python suites and installed SDK
        run: |
          for phase in 2 3 4 5 6; do python3 -m unittest discover -s research/phase${phase}/tests -q; done
          python3 -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/pip" install --no-deps .
          "$RUNNER_TEMP/sdk/bin/khaledpoly-paper-sdk" --help
      - name: Short public PAPER capture with compressed journal
        timeout-minutes: 5
        run: python3 research/phase3/public_smoke.py --compressed-tape
      - name: Verify new compressed capture normalized/raw action parity and stress
        timeout-minutes: 6
        run: python3 research/phase2/replay_smoke.py research/output/phase3-public/ingestor
      - uses: actions/download-artifact@v4
        with:
          name: two-hour-paper-small-reports
          run-id: 39058688247
          github-token: ${{ github.token }}
          path: original-reports
      - uses: actions/download-artifact@v4
        with:
          name: two-hour-paper-39048983750
          run-id: 39048983750
          github-token: ${{ github.token }}
          path: original-archive
      - name: Prepare original recording losslessly without a new trading run
        timeout-minutes: 6
        run: >-
          python3 -u -m research.phase6.prepare_recorded_replay prepare
          --archive original-archive/two-hour-paper-evidence.tar.gz --output recorded-input
      - name: Replay the full original two-hour public tape through corrected strategy
        timeout-minutes: 18
        run: >-
          java -Xmx2g -Dloader.main=com.polybot.hft.executor.replay.ClosedLoopMain
          -cp executor-service/target/executor-service-0.6.0.jar
          org.springframework.boot.loader.launch.PropertiesLauncher
          recorded-input/events.jsonl.gz research/output/lifecycle-replay
          research/phase2/research-config.json --raw
      - name: Compare original observations with updated counterfactual replay
        run: >-
          python3 -m research.phase6.prepare_recorded_replay compare
          --original original-reports/final-metrics.json
          --replay research/output/lifecycle-replay
          --output research/output/lifecycle-comparison.json
      - name: Retain small reports and complete action audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-fix-evidence
          retention-days: 3
          path: |
            **/target/surefire-reports/
            research/output/lifecycle-comparison.json
            research/output/lifecycle-replay/report.json
            research/output/lifecycle-replay/audit.jsonl
            research/output/phase3-public/summary.json
            research/output/phase3-public/ingestor/*/replay-*/report.json
            recorded-input/provenance.json
