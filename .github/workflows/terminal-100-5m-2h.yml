name: Khaledpoly aggressive maker PAPER - 100 USDC - 5m - 2h

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/terminal-100-5m-2h.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-100-5m-2h
  cancel-in-progress: false

jobs:
  maker_5m_100_paper:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - name: Offline paper accounting and proxy-fill tests
        run: |
          python3 -m py_compile research/terminal_100_5m_2h.py
          python3 research/terminal_100_5m_2h.py --self-test
      - name: Probe public Polymarket BTC ETH SOL 5m feeds (no login, no keys)
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import importlib.util,time
          src='research/terminal_100_5m_2h.py'
          spec=importlib.util.spec_from_file_location('model',src)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          slot=int(time.time())//300*300
          market=m.market_for_slot(slot,m.new_state() if hasattr(m,'new_state') else {'counters':m.counters()})
          if market is None:
              market=m.market_for_slot(slot-300,{'counters':m.counters()})
          if market is None:
              raise RuntimeError('No 5m market metadata available on public APIs')
          books=m.quote(market)
          print('FIVE_MINUTE_PUBLIC_DATA_PREFLIGHT',market['slug'],books)
          PY
      - name: Run continuous two-hour BTC ETH SOL 5m read-only PAPER trial
        timeout-minutes: 125
        run: |
          python3 -u research/terminal_100_5m_2h.py \
            --duration-seconds 7200 \
            --output-dir paper_runs/terminal_100_5m_2h
      - name: Verify report and capital conservation
        if: success()
        run: |
          python3 - <<'PY'
          import json
          with open('paper_runs/terminal_100_5m_2h/summary.json',encoding='utf8') as f:
              r=json.load(f)
          assert r['started_with_usdc']==100.0
          assert r['stages_done']==1
          assert abs(r['cash_usdc']-r['started_with_usdc']-r['realized_pnl_usdc'])<0.0001
          assert r['metrics']['markets_seen']>=1,'No public markets encountered'
          assert r['metrics']['merged']+r['metrics']['one_sided']+r['metrics']['zero_fills']==len(r['trades'])
          print('PAPER_100_5M_2H_COMPLETE',json.dumps({k:v for k,v in r.items() if k!='trades'}))
          PY
      - name: Save all available raw events and final or partial state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-100-5m-2h-aggressive-paper-results
          retention-days: 14
          if-no-files-found: warn
          path: paper_runs/terminal_100_5m_2h/
