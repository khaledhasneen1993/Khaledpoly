name: Khaledpoly balanced 15m PAPER 1h
on:
  push:
    branches: [main]
    paths: [.github/workflows/balanced-15m-paper-1h.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  balanced:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Prepare balanced strategy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('research/terminal_100_5m_2h.py').read_text()
          changes={
            'slot=(now//300)*300':'slot=(now//900)*900',
            'left=slot+300-now':'left=slot+900-now',
            'slug = f"{asset}-updown-5m-{slot}"':'slug = f"{asset}-updown-15m-{slot}"',
            'SHARES = 18.0':'SHARES = 5.0',
            'MIN_EDGE = 0.015':'MIN_EDGE = 0.025',
            'FIRST_LEG_TIMEOUT = 42':'FIRST_LEG_TIMEOUT = 12',
            'EXIT_DRAWDOWN = 0.14':'EXIT_DRAWDOWN = 0.03',
            'MAX_CYCLES_PER_SLOT = 3':'MAX_CYCLES_PER_SLOT = 1',
            'if slot != last_slot:':'if s["realized_pnl"] <= -2.0: break\n            if slot != last_slot:',
            'emit(events,"market_discovered",slug=m["slug"])':'emit(events,"market_discovered",slug=m["slug"] if m else "unavailable")',
            'entries_this_slot < MAX_CYCLES_PER_SLOT':'entries_this_slot < MAX_CYCLES_PER_SLOT and s["realized_pnl"] > -2.0',
            'if all(v is not None for v in (yp,np,ya,na)) and yp<ya and np<na and yp+np<=CAP':'if all(v is not None for v in (yp,np,ya,na)) and yp<ya and np<na and (ya-yp)+(na-np)<=0.055 and yp+np<=CAP',
            'active=close_position(s,active,q,events,"aggressive_one_sided_exit")':'active=close_position(s,active,q,events,"aggressive_one_sided_exit")\n                        entries_this_slot=MAX_CYCLES_PER_SLOT',
          }
          for old,new in changes.items():
              assert old in s, 'Missing expected anchor: '+old
              s=s.replace(old,new)
          Path('/tmp/khaledpoly_balanced.py').write_text(s)
          PY
          python3 -m py_compile /tmp/khaledpoly_balanced.py
          python3 /tmp/khaledpoly_balanced.py --self-test
      - name: One-hour PAPER simulation
        timeout-minutes: 65
        run: |
          python3 -u /tmp/khaledpoly_balanced.py --duration-seconds 3600 --output-dir paper_runs/balanced_15m_1h
      - name: Validate accounting
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('paper_runs/balanced_15m_1h/summary.json'))
          assert abs(r['cash_usdc']-100-r['realized_pnl_usdc'])<0.0001
          assert r['metrics']['merged']+r['metrics']['one_sided']+r['metrics']['zero_fills']==len(r['trades'])
          print('BALANCED_1H_SUMMARY',json.dumps({k:v for k,v in r.items() if k!='trades'}))
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balanced-15m-100usdc-1h-paper-results
          path: paper_runs/balanced_15m_1h/
          retention-days: 14
