name: PAPER exact653 receipt pool native parity ONLY
on:
  push:
    branches: [paper-fill-investigation]
    paths: ['.github/workflows/post651-receipt-pool.yml', 'research/phase6/post651-pool-freeze.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-exact653-native-parity
  cancel-in-progress: false
jobs:
  native-parity-no-tape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Frozen653 expansion and regressions; no RPC or tape
        run: |
          python3 -c 'import json,hashlib;from pathlib import Path;f=json.loads(Path("research/phase6/post651-pool-freeze.json").read_bytes());assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==s for p,s in f["filesSha256"].items())'
          python3 -m unittest research.phase6.tests.test_post651_receipt_pool research.phase6.tests.test_post651_next_receipts_result -q
          python3 -m research.phase6.post651_receipt_pool --output "$RUNNER_TEMP/pool653"
      - name: Checkout frozen exact651 source-builder inputs only
        uses: actions/checkout@v4
        with:
          ref: 2f47b7110908bd9311d410be75dd0173b14f04d7
          path: frozen-source651
          persist-credentials: false
      - name: Generate the unchanged exact651 source bridge
        working-directory: frozen-source651
        run: |
          python3 -m research.phase6.next_postactivation_pool_build --output "$RUNNER_TEMP/source653"
      - uses: actions/download-artifact@v4
        with:
          name: entry-witness-executor
          run-id: 39168798844
          github-token: ${{ github.token }}
          path: probe-engine
      - name: Verify all653 native identities and1553 tuples
        run: |
          python3 -c 'import hashlib;from pathlib import Path;assert hashlib.sha256(Path("probe-engine/executor-service-0.6.0.jar").read_bytes()).hexdigest()=="bfc7bef081927f774374f92e5443c197e308e4828983dd9c19ac0ef280c45963"'
          unzip -q probe-engine/executor-service-0.6.0.jar 'BOOT-INF/lib/*' -d "$RUNNER_TEMP/deps653"
          mkdir -p "$RUNNER_TEMP/classes653" research/output/post651-pool653
          javac -cp "$RUNNER_TEMP/deps653/BOOT-INF/lib/*" -d "$RUNNER_TEMP/classes653" $(find "$RUNNER_TEMP/source653/polybot-core/src/main/java" -name '*.java') research/phase6/ConservedMixedReplayLabels.java research/phase6/ConservedMixedReplayLabelsProbe.java research/phase6/OfflineSessionLabels.java research/phase6/CanonicalSessionParityProbe.java research/phase6/FrozenResearchPolicies.java research/phase6/FrozenStrategySessionProbe.java research/phase6/ConservedReceiptPool.java research/phase6/ConservedReceiptPoolProbe.java research/phase6/NativeReplaySupport.java research/phase6/CompleteSourceIdentityIndex.java "$RUNNER_TEMP/source653/research/phase6/IndexedExecutionLabels.java" research/phase6/IndexedReplaySupport.java research/phase6/Post651ReceiptPoolProbe.java
          cp653="$RUNNER_TEMP/classes653:$RUNNER_TEMP/deps653/BOOT-INF/lib/*"
          java -Xmx1g -cp "$cp653" com.polybot.hft.paper.Post651ReceiptPoolProbe "$RUNNER_TEMP/pool653/pool.json" "$RUNNER_TEMP/pool653/source-identities.json" "$RUNNER_TEMP/native653"
          cp "$RUNNER_TEMP/native653/native-proof.json" "$RUNNER_TEMP/pool653/summary.json" research/output/post651-pool653/
          python3 -c 'import json;from pathlib import Path;from research.phase6.post651_receipt_pool import verify_native;r=Path("research/output/post651-pool653");print(verify_native(json.loads((r/"native-proof.json").read_text()),json.loads((r/"summary.json").read_text())))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact653-native-parity-no-tape
          retention-days: 7
          path: research/output/post651-pool653/
          if-no-files-found: error
